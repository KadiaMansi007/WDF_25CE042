
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f4f4f4;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
        }

        input {
            display: block;
            width: 95%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            padding: 8px 14px;
            margin: 5px;
            cursor: pointer;
        }

        li {
            margin: 15px 0;
            padding: 12px;
            background: #eeeeee;
            border-radius: 5px;
        }

        #status {
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Management System</h1>

    <p id="status"></p>

    <h2 id="form-title">Add Student</h2>

    <form id="student-form">

        <input type="text" name="name" placeholder="Student Name" required>

        <input type="email" name="email" placeholder="Email Address" required>

        <input type="text" name="course" placeholder="Course" required>

        <button type="submit" id="submit-button">Add Student</button>

        <button type="button" id="cancel-button" hidden>
            Cancel Update
        </button>

    </form>

    <h2>Student Records</h2>

    <ul id="students"></ul>

</div>

<script>

const api = "api_students.php";

const form = document.getElementById("student-form");
const list = document.getElementById("students");
const statusBox = document.getElementById("status");

const submitButton = document.getElementById("submit-button");
const cancelButton = document.getElementById("cancel-button");
const formTitle = document.getElementById("form-title");

let editId = null;


async function loadStudents() {

    statusBox.textContent = "Loading students...";

    try {

        const response = await fetch(api);

        const students = await response.json();

        if (!response.ok) {
            throw new Error("Unable to load students.");
        }

        list.replaceChildren();

        students.forEach(student => {

            const li = document.createElement("li");

            li.textContent =
                student.name + " (" + student.email + ") - " + student.course + " ";

            const editButton = document.createElement("button");

            editButton.textContent = "Edit";

            editButton.addEventListener("click", function () {
                editStudent(student);
            });

            const deleteButton = document.createElement("button");

            deleteButton.textContent = "Delete";

            deleteButton.addEventListener("click", function () {
                deleteStudent(student.id);
            });

            li.appendChild(editButton);
            li.appendChild(deleteButton);

            list.appendChild(li);

        });

        statusBox.textContent = students.length + " student(s) loaded.";

    } catch (error) {

        statusBox.textContent = error.message;

    }
}


function editStudent(student) {

    editId = student.id;

    form.elements["name"].value = student.name;
    form.elements["email"].value = student.email;
    form.elements["course"].value = student.course;

    formTitle.textContent = "Update Student";
    submitButton.textContent = "Update Student";

    cancelButton.hidden = false;

    statusBox.textContent = "Editing student: " + student.name;

}


cancelButton.addEventListener("click", function () {

    form.reset();

    editId = null;

    formTitle.textContent = "Add Student";
    submitButton.textContent = "Add Student";

    cancelButton.hidden = true;

    statusBox.textContent = "Update cancelled.";

});


form.addEventListener("submit", async function (event) {

    event.preventDefault();

    const data = {
        name: form.elements["name"].value,
        email: form.elements["email"].value,
        course: form.elements["course"].value
    };

    let method = "POST";

    if (editId !== null) {

        method = "PUT";
        data.id = editId;

    }

    try {

        const response = await fetch(api, {

            method: method,

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(data)

        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || "Operation failed.");
        }

        statusBox.textContent = result.message;

        form.reset();

        editId = null;

        formTitle.textContent = "Add Student";
        submitButton.textContent = "Add Student";

        cancelButton.hidden = true;

        await loadStudents();

    } catch (error) {

        statusBox.textContent = error.message;

    }

});


async function deleteStudent(id) {

    if (!confirm("Are you sure you want to delete this student?")) {
        return;
    }

    try {

        const response = await fetch(api, {

            method: "DELETE",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({id: id})

        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || "Delete failed.");
        }

        statusBox.textContent = result.message;

        await loadStudents();

    } catch (error) {

        statusBox.textContent = error.message;

    }

}
loadStudents();

</script>

</body>
</html>
